<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Management System</title>
  <link rel="stylesheet" href="style.css">
<style type="text/css" id="dcoder_stylesheet">body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  padding: 40px;
}

.container {
  max-width: 600px;
  margin: auto;
  background: #fff;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 0 10px #ccc;
}

h1 {
  text-align: center;
}

form {
  display: flex;
  flex-direction: column;
}

input, textarea {
  margin-bottom: 10px;
  padding: 10px;
  font-size: 16px;
}

button {
  padding: 10px;
  background-color: #009578;
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 5px;
}

button:hover {
  background-color: #007a63;
}

.task {
  border: 1px solid #ddd;
  padding: 15px;
  margin-top: 10px;
  background: #f9f9f9;
  border-radius: 5px;
}
</style></head>
<body>
  <div class="container">
    <h1>TaskFlow Management System</h1>

    <form id="taskForm">
      <input type="text" id="title" placeholder="Task title" required>
      <textarea id="description" placeholder="Task description"></textarea>
      <button type="submit">Add Task</button>
    </form>

    <div id="taskList"></div>
  </div>

  <script src="script.js"></script>

<script type="text/javascript" id="dcoder_script">document.addEventListener("DOMContentLoaded", loadTasks);

document.getElementById("taskForm").addEventListener("submit", function (e) {
  e.preventDefault();
  const title = document.getElementById("title").value;
  const description = document.getElementById("description").value;

  fetch("add_task.php", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: `title=${encodeURIComponent(title)}&description=${encodeURIComponent(description)}`
  })
    .then(response => response.text())
    .then(() => {
      loadTasks();
      document.getElementById("taskForm").reset();
    });
});

function loadTasks() {
  fetch("get_tasks.php")
    .then(response => response.json())
    .then(tasks => {
      const taskList = document.getElementById("taskList");
      taskList.innerHTML = "";
      tasks.forEach(task => {
        const div = document.createElement("div");
        div.className = "task";
        div.innerHTML = `
          <strong>${task.title}</strong>
          <p>${task.description}</p>
          <button onclick="deleteTask(${task.id})">Delete</button>
        `;
        taskList.appendChild(div);
      });
    });
}

function deleteTask(id) {
  fetch(`delete_task.php?id=${id}`)
    .then(() => loadTasks());
}
</script></body></html>
